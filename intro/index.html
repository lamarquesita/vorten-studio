<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start a project — Vorten Studio</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,800,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#E8ECEA;--dark:#2C4E3E;--gray:#787B79;--white:#fff}
html{-webkit-font-smoothing:antialiased}
body{font-family:'Satoshi',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--dark);line-height:1.5;font-weight:700;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ─── HEADER (same as home) ─── */
header{position:fixed;top:0.75rem;left:50%;transform:translateX(-50%);z-index:999;display:flex;gap:0.875rem;align-items:center}
.logo{width:2.75rem;height:2.75rem;background:var(--white);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;flex-shrink:0}
.nav-pill{height:2.75rem;padding:0 1.25rem;background:var(--white);border-radius:9999px;display:flex;align-items:center;font-size:13px;font-weight:500;color:var(--gray);letter-spacing:-0.02em;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:color .3s;white-space:nowrap}
.nav-pill:hover{color:var(--dark)}

/* ─── FLOW ─── */
.flow{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:6.5rem 1.25rem 6.5rem;text-align:center;overflow:hidden}
.watermark{position:absolute;left:50%;bottom:0;width:min(66rem,200vw);height:auto;max-width:none;transform:translate(-50%,22.5%);opacity:.07;mix-blend-mode:multiply;pointer-events:none;user-select:none}
.stage{position:relative;width:100%;max-width:60rem}
.step{animation:step-in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes step-in{from{opacity:0;transform:translateY(14px)}}
.step h1{font-size:52px;font-weight:900;letter-spacing:-0.03em;line-height:1.07;white-space:pre-line;margin:0 auto 1.75rem;max-width:13em}
.step .lede{max-width:26rem;margin:-0.75rem auto 1.75rem;font-size:16px;font-weight:500;line-height:1.5rem;color:var(--gray)}

.field{display:block;width:min(26rem,100%);height:54px;margin:0 auto;border:0;border-radius:9999px;background:var(--white);padding:0 1.25rem;font:inherit;font-size:16px;font-weight:500;color:var(--dark);outline:none;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .2s}
.field::placeholder{color:#A1A5A3}
.field:focus{box-shadow:0 0 0 2px var(--dark)}
textarea.field{height:9.5rem;border-radius:1.5rem;padding:1rem 1.25rem;resize:none;line-height:1.5rem;text-align:left;width:min(32rem,100%)}

.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:0.625rem;max-width:40rem;margin:0 auto}
.opt{height:54px;padding:0 1.5rem;border-radius:9999px;background:var(--white);font-size:15px;font-weight:700;color:var(--dark);box-shadow:0 1px 3px rgba(0,0,0,.06);transition:background .2s,color .2s}
.opt[aria-pressed="true"]{background:var(--dark);color:var(--white)}

.actions{margin-top:1.75rem;display:flex;flex-direction:column;align-items:center;gap:0.75rem}
.go{height:54px;padding:0 1.5rem;border-radius:9999px;background:var(--dark);color:var(--white);font-size:15px;font-weight:700;transition:opacity .2s}
.go:disabled{opacity:.4;cursor:default}
.back{font-size:14px;font-weight:500;color:var(--gray);padding:.25rem .5rem}
.back:hover{color:var(--dark)}
.hint{font-size:12px;font-weight:500;color:#A1A5A3}

.cal{width:min(58rem,100%);min-height:36rem;margin:0 auto;background:var(--white);border-radius:1.5rem;overflow:hidden}
.cal iframe{width:100%;min-height:36rem;border:0}

.progress{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);width:20rem;max-width:calc(100% - 3rem);height:8px;border-radius:9999px;background:var(--white);overflow:hidden;z-index:5}
.progress i{display:block;height:100%;width:0;background:var(--dark);border-radius:inherit;transition:width .45s cubic-bezier(.4,0,.2,1)}

@media(max-width:640px){
  header{gap:.5rem}
  .nav-pill{padding:0 .875rem}
  .flow{padding:6rem 1.0625rem 5.5rem;align-items:flex-start}
  .stage{margin-top:12vh}
  .step h1{font-size:30px;margin-bottom:1.5rem}
  .opt{height:50px;padding:0 1.25rem;font-size:14px}
  .go{width:100%;max-width:26rem}
  .cal{border-radius:1.25rem}
}
@media(prefers-reduced-motion:reduce){.step{animation:none}.progress i{transition:none}}
</style>
</head>
<body>

<header>
  <a href="/" class="logo" aria-label="Home"><img src="../assets/logo.png" alt="Vorten Studio" style="width:100%;height:100%;object-fit:cover;transform:scale(.82)"></a>
  <a href="/work" class="nav-pill">Recent work</a>
</header>

<main class="flow">
  <img src="../assets/logo.png" alt="" class="watermark" aria-hidden="true">
  <div class="stage" id="stage" aria-live="polite"></div>
</main>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>

<script>
// ─── Start a project: one question per screen, then book a call (Cal.com) ───
const CAL_LINK = 'vorten.studio/20min';
const STEPS = [
  {id:'name',    type:'text', h:'What is your name?', ph:'Your name...', input:'text', ac:'name'},
  {id:'email',   type:'text', h:'What is your best email?', ph:'you@company.com', input:'email', ac:'email'},
  {id:'company', type:'text', h:'What is the name of your company?', ph:'Your company name...', ac:'organization'},
  {id:'website', type:'text', h:'What is your website URL?', ph:'yourcompany.com', input:'url', ac:'url', optional:true},
  {id:'help',    type:'options', h:'How can we help?', multiple:true, lede:'Pick as many as you need.',
    options:['MVP Development','Web & Mobile Apps','Product Design','Product Strategy','Audits & Redesigns']},
  {id:'budget',  type:'options', h:'What is your budget for the project?', options:['<$10K','$10K–$20K','$20K–$50K','$50K–$100K','$100K+']},
  {id:'start',   type:'options', h:'When would you like to start?', options:['ASAP','1–2 weeks','2–4 weeks','1–3 months','3+ months']},
  {id:'details', type:'textarea', h:'Tell us about\nyour project', ph:'What are you building, who is it for, and where are you today?', optional:true},
  {id:'referral',type:'options', h:'How did you find us?', options:['LinkedIn','Google','AI chat','Twitter/X','Friends','Other']},
  {id:'book',    type:'book', h:'Pick a time to talk', lede:'A 20-minute intro call with the team.'},
  {id:'booked',  type:'booked'},
];
const COUNTED = STEPS.length - 1; // the confirmation screen doesn't count toward progress

const KEY = 'vorten-intro';
let state = {i:0, a:{}};
try { const s = JSON.parse(sessionStorage.getItem(KEY)); if (s && s.a) state = s; } catch(e) {}
if (state.i >= STEPS.length - 1) state.i = 0;   // never reopen on the confirmation screen
const save = () => { try { sessionStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };

const stage = document.getElementById('stage'), bar = document.getElementById('bar');
const el = (tag, props = {}, kids = []) => { const e = Object.assign(document.createElement(tag), props); kids.forEach(k => e.append(k)); return e; };
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());

function valid(step) {
  const v = state.a[step.id];
  if (step.optional) return true;
  if (step.type === 'options') return step.multiple ? Array.isArray(v) && v.length > 0 : !!v;
  if (step.input === 'email') return !!v && validEmail(v);
  return !!(v && v.trim());
}

function go(delta) {
  const next = Math.max(0, Math.min(STEPS.length - 1, state.i + delta));
  if (next === state.i) return;
  state.i = next; save(); render();
}

function render() {
  const step = STEPS[state.i];
  bar.style.width = (Math.min(state.i + 1, COUNTED) / COUNTED * 100) + '%';
  bar.parentElement.style.display = (step.type === 'book' || step.type === 'booked') ? 'none' : ''; // calendar + confirmation: no progress bar over the content
  const wrap = el('div', {className:'step'});
  if (step.h) wrap.append(el('h1', {textContent: step.h}));
  if (step.lede) wrap.append(el('p', {className:'lede', textContent: step.lede}));

  const actions = el('div', {className:'actions'});
  const cont = el('button', {className:'go', type:'button', textContent:'Continue'});
  const refresh = () => {
    cont.disabled = !valid(step);
    if (step.optional) cont.textContent = (state.a[step.id] || '').trim() ? 'Continue' : 'Skip';
  };
  cont.onclick = () => { if (valid(step)) go(1); };

  if (step.type === 'text' || step.type === 'textarea') {
    const f = el(step.type === 'textarea' ? 'textarea' : 'input', {className:'field', placeholder: step.ph || '', value: state.a[step.id] || ''});
    if (step.type === 'text') { f.type = step.input === 'email' ? 'email' : 'text'; if (step.ac) f.autocomplete = step.ac; if (step.input === 'url') f.inputMode = 'url'; }
    f.setAttribute('aria-label', step.h.replace('\n', ' '));
    f.oninput = () => { state.a[step.id] = f.value; save(); refresh(); };
    f.onkeydown = e => {
      const submit = e.key === 'Enter' && (step.type === 'text' || e.metaKey || e.ctrlKey);
      if (submit) { e.preventDefault(); cont.click(); }
    };
    wrap.append(f);
    setTimeout(() => f.focus({preventScroll:true}), 60);
    actions.append(cont);
    if (step.type === 'textarea') actions.append(el('span', {className:'hint', textContent:'⌘ + Enter to continue'}));
  }

  if (step.type === 'options') {
    const group = el('div', {className:'opts', role: step.multiple ? 'group' : 'radiogroup'});
    group.setAttribute('aria-label', step.h);
    step.options.forEach(o => {
      const picked = () => step.multiple ? (state.a[step.id] || []).includes(o) : state.a[step.id] === o;
      const b = el('button', {className:'opt', type:'button', textContent:o});
      const sync = () => b.setAttribute('aria-pressed', picked() ? 'true' : 'false');
      b.onclick = () => {
        if (step.multiple) {
          const cur = new Set(state.a[step.id] || []);
          cur.has(o) ? cur.delete(o) : cur.add(o);
          state.a[step.id] = [...cur];
        } else {
          state.a[step.id] = o;
        }
        save(); group.querySelectorAll('.opt').forEach(x => x._sync()); refresh();
        if (!step.multiple) setTimeout(() => { if (STEPS[state.i] === step) go(1); }, 260); // single choice moves on by itself
      };
      b._sync = sync; sync(); group.append(b);
    });
    wrap.append(group);
    actions.append(cont);
  }

  if (step.type === 'book') {
    wrap.append(el('div', {className:'cal', id:'cal-embed'}));
    requestAnimationFrame(mountCal);
  }

  if (step.type === 'booked') {
    const first = (state.a.name || '').trim().split(/\s+/)[0];
    wrap.append(el('h1', {textContent: `You're booked${first ? ', ' + first : ''}.`}));
    wrap.append(el('p', {className:'lede', textContent: `We sent the invite to ${state.a.email || 'your inbox'}. Talk soon.`}));
    actions.append(el('a', {className:'go', href:'/', textContent:'Back to home', style:'display:inline-flex;align-items:center'}));
    try { sessionStorage.removeItem(KEY); } catch(e) {}
  }

  if (state.i > 0 && step.type !== 'booked') {
    actions.append(el('button', {className:'back', type:'button', textContent:'← Back', onclick: () => go(-1)}));
  }
  wrap.append(actions);
  refresh();
  stage.replaceChildren(wrap);
}

// Final step: Cal.com calendar, pre-filled with name + email and every answer in the booking notes
function summary() {
  const a = state.a, list = v => Array.isArray(v) ? v.join(', ') : (v || '—');
  return [
    `Company: ${a.company || '—'}`, `Website: ${a.website || '—'}`, `Help with: ${list(a.help)}`,
    `Budget: ${a.budget || '—'}`, `Start: ${a.start || '—'}`, `Found us via: ${a.referral || '—'}`,
    '', (a.details || '').trim() || '(no project details)'
  ].join('\n');
}
function mountCal() {
  (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement('script')).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === 'string') { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ['initNamespace', namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, 'https://app.cal.com/embed/embed.js', 'init');
  if (!window.__calInit) { Cal('init', 'intro', {origin:'https://cal.com'}); window.__calInit = true;
    Cal.ns.intro('ui', {theme:'light', cssVarsPerTheme:{light:{'cal-brand':'#2C4E3E'}}, hideEventTypeDetails:false, layout:'month_view'});
    ['bookingSuccessful','bookingSuccessfulV2'].forEach(action => Cal.ns.intro('on', {action, callback: () => { if (STEPS[state.i].type === 'book') go(1); }}));
  }
  Cal.ns.intro('inline', {elementOrSelector:'#cal-embed', calLink: CAL_LINK, layout:'month_view',
    config: {theme:'light', name: state.a.name || '', email: state.a.email || '', notes: summary()}});
}

render();
</script>
</body>
</html>
